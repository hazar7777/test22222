<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=h1, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="preloader"></div>
    <h1 id="test">hello</h1>
    <button onclick="change()" id="btn">click me</button>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/cmsVZPjsMTQ?si=F2hfzSxouQ5_iDbU" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
</body>
<script>
document.getElementById("btn").addEventListener("click",function (){
    document.getElementById("test").style.backgroundColor="red";
})
function change(){
    document.getElementById("test").style.color="blue";
}
window.addEventListener("load",function(){
    document.getElementById("preloader").style.display="none";
})
</script>
</html>
